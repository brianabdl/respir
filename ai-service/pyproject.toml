[project]
name = "clinic-ai-service"
version = "0.1.0"
description = "Local clinical audio inference and Vertex MedGemma gateway for the clinic consult app."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=11.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "soundfile>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
ml = [
    "accelerate>=1.1",
    "huggingface-hub>=0.26",
    "scikit-learn>=1.8,<1.9",
    "sentence-transformers>=3.2",
    "torch>=2.4",
    "transformers>=4.46",
    "xgboost>=2.1,<3",
]
vertex = ["google-cloud-aiplatform>=1.70"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
