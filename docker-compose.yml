services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: respair-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./storage:/var/www/storage
        ports:
            - '8000:8000'
        networks:
            - respair
        depends_on:
            - db
            - redis
        environment:
            - DB_CONNECTION=pgsql
            - DB_HOST=db
            - DB_PORT=5432
            - DB_DATABASE=agen_gemma
            - DB_USERNAME=postgres
            - DB_PASSWORD=postgres
            - REDIS_HOST=redis
            - REDIS_PORT=6379

    db:
        image: pgvector/pgvector:pg16
        container_name: respair-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: agen_gemma
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        networks:
            - respair

    redis:
        image: redis:7-alpine
        container_name: respair-redis
        restart: unless-stopped
        ports:
            - '6379:6379'
        networks:
            - respair

    reverb:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: respair-reverb
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        ports:
            - '8080:8080'
        networks:
            - respair
        depends_on:
            - app
        command: php artisan reverb:start --host=0.0.0.0 --port=8080

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: respair-queue
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - respair
        depends_on:
            - app
            - redis
        command: php artisan queue:work --tries=3

    ai-service:
        build:
            context: ./ai-service
            dockerfile: Dockerfile
        container_name: respair-ai-service
        restart: unless-stopped
        working_dir: /app
        volumes:
            - ./ai-service:/app
        ports:
            - '9000:9000'
        networks:
            - respair
        environment:
            - AI_SERVICE_TOKEN=change-me

networks:
    respair:
        driver: bridge

volumes:
    postgres_data:
